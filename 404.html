<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">
    <title>Memory Not Found // NEKYA</title>

    <style>
        :root {
            --bg: #050505;
            --panel: #090909;
            --text: #f4f4f4;
            --muted: #666666;
            --border: #1a1a1a;
            --red: #8b0000;
            --red-bright: #bd0000;
        }

        body.fracture-theme {
            --bg: #e9e5de;
            --panel: #f1ede6;
            --text: #161616;
            --muted: #68625b;
            --border: #c7c0b6;
            --red: #760000;
            --red-bright: #a60000;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 30px;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 20%, rgba(130,0,0,.12), transparent 38%),
                var(--bg);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            transition: background .3s ease, color .3s ease;
        }

        .grid {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .12;
            background-image:
                linear-gradient(rgba(127,127,127,.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(127,127,127,.08) 1px, transparent 1px);
            background-size: 55px 55px;
        }

        main {
            position: relative;
            z-index: 1;
            width: min(780px, 100%);
            padding: 50px;
            border: 1px solid var(--border);
            background: color-mix(in srgb, var(--panel) 90%, transparent);
        }

        .code {
            color: var(--red);
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 4px;
        }

        h1 {
            margin-top: 18px;
            font-size: clamp(56px, 11vw, 120px);
            line-height: .85;
            letter-spacing: -6px;
        }

        h1 span {
            color: var(--red);
        }

        .line {
            height: 1px;
            margin: 32px 0;
            background: linear-gradient(90deg, var(--red), transparent);
        }

        p {
            max-width: 570px;
            color: var(--muted);
            line-height: 1.8;
        }

        .signal {
            margin-top: 18px;
            color: var(--red);
            font-family: monospace;
            font-size: 9px;
            letter-spacing: 3px;
        }

        a {
            display: inline-block;
            margin-top: 32px;
            padding: 14px 20px;
            border: 1px solid var(--red-bright);
            background: var(--red);
            color: white;
            text-decoration: none;
            font-family: monospace;
            font-size: 10px;
            letter-spacing: 2px;
        }

        a:hover {
            background: var(--red-bright);
        }

        @media (max-width: 600px) {
            main {
                padding: 34px 25px;
            }

            h1 {
                letter-spacing: -4px;
            }
        }
    </style>

    <script src="i18n.js?v=stable-4-lang"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            try {
                const stableState = JSON.parse(localStorage.getItem("nekyaStateStable3") || "{}");
                const legacyTheme = localStorage.getItem("nekyaTheme");
                const theme = stableState.theme || legacyTheme;

                if (theme === "fracture") {
                    document.body.classList.add("fracture-theme");
                    document.querySelector('meta[name="theme-color"]')?.setAttribute("content", "#e9e5de");
                }

                const i18n = window.NEKYA_I18N;
                const savedLanguage = stableState.language || localStorage.getItem("nekyaLanguage");
                const locale = i18n
                    ? i18n.normalizeLocale(savedLanguage || i18n.detectLocale())
                    : "en-US";

                if (i18n) {
                    document.documentElement.lang = locale;
                    document.title = `${i18n.t(locale, "404.title")} // NEKYA`;
                    document.getElementById("error-code").textContent = i18n.t(locale, "404.code");
                    document.getElementById("error-title").textContent = i18n.t(locale, "404.title");
                    document.getElementById("error-message").textContent = i18n.t(locale, "404.message");
                    document.getElementById("error-return").textContent = i18n.t(locale, "404.return");
                    document.getElementById("error-signal").textContent = i18n.t(locale, "404.signal");
                }
            } catch (error) {
                // The 404 page remains usable even if storage/localization is unavailable.
            }
        });
    </script>
</head>
<body>
    <div class="grid"></div>

    <main>
        <p class="code" id="error-code">ERROR // 404</p>
        <h1 id="error-title">MEMORY NOT FOUND</h1>
        <div class="line"></div>
        <p id="error-message">
            The requested record does not exist, has been removed, or was never meant to be accessed.
        </p>
        <p class="signal" id="error-signal">SIGNAL LOST</p>
        <a id="error-return" href="/nekya-website/">RETURN TO NEKYA</a>
    </main>
</body>
</html>
